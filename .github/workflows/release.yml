name: Release

# Al publicar una etiqueta vX.Y.Z se genera el ZIP que los usuarios suben a Claude.ai o ChatGPT.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar la skill
        run: |
          mkdir -p dist
          cd skills
          zip -r ../dist/fintube-analyst-auditor.zip fintube-analyst-auditor -x "*/evals/*" "*__pycache__*" "*.DS_Store"

      - name: Crear la release con el ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo la seccion del CHANGELOG de esta version (de "## X.Y.Z" hasta la siguiente "## ").
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/fintube-analyst-auditor.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
